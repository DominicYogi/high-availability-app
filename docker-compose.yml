version: '3'

services:
  app-1:
    build: .
    environment:
      - INSTANCE_NAME=app-1

  app-2:
    build: .
    environment:
      - INSTANCE_NAME=app-2

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-1
      - app-2
